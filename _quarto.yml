project:
  type: website

website:
  title: "PRC Data Challenge"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - data.qmd
      - rankings.qmd
      - about.qmd
    include-in-header:
      text: |
          <!-- Matomo -->
          <script>
            var _paq = window._paq = window._paq || [];
            _paq.push(['trackPageView']);
            _paq.push(['enableLinkTracking']);
            (function() {
              var u="//stats.eurocontrol.int/";
              _paq.push(["setTrackerUrl", u+"matomo.php"]);
              _paq.push(["setSiteId", "26"]);
              var d=document, g=d.createElement("script"), s=d.getElementsByTagName("script")[0];
              g.async=true; g.src=u+"matomo.js"; s.parentNode.insertBefore(g,s);
            })();
          </script>
          <!-- End Matomo Code -->

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true

filters:
  - acronyms

acronyms:
  loa_title: "List of Acronyms"
  include_unused: false
  insert_loa: "end"
  insert_links: true
  id_prefix: "acronyms_"
  sorting: "alphabetical"
  non_existing: "key"
  # style: "long-short"
  loa_format: '`**{shortname}**: {longname}`{=raw}'
  loa_header_classes:
  - unnumbered
  fromfile:
    - _acronyms.yml


